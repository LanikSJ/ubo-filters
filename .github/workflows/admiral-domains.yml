name: Admiral Domains

on:
  schedule:
    - cron: "30 0 * * 1" # Runs 00:30 UTC Only on Monday
  push:
    branches:
      - main
    paths:
      - ".github/workflows/admiral-domains.yml"
  pull_request:
    paths:
      - ".github/workflows/admiral-domains.yml"
  workflow_dispatch:

env:
  NODE_VERSION: 20

permissions:
  contents: write
  pull-requests: write

jobs:
  Updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install FOP CLI
        run: ./scripts/install-fop.sh

      - name: Download Admiral List
        run: |
          # Preserve header (first 15 lines) and append new domains
          ./scripts/remove-lines.sh filters/getadmiral-domains.txt 15 > filters/getadmiral-domains.tmp
          curl -L https://raw.githubusercontent.com/LanikSJ/AdmiraList/master/AdmiraList.txt | sed 's/^/||/; s/$/^/' >> filters/getadmiral-domains.tmp
          mv filters/getadmiral-domains.tmp filters/getadmiral-domains.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Export Dead Domains
        run: npx dead-domains-linter --export dead-domains.txt filters/getadmiral-domains.txt

      - name: Remove Dead Domains from Admiral List
        run: |
          if [ -f dead-domains.txt ] && [ -s dead-domains.txt ]; then
            while IFS= read -r domain; do
              [ -z "$domain" ] && continue
              grep -vF "||${domain}^" filters/getadmiral-domains.txt > filters/getadmiral-domains.tmp
              mv filters/getadmiral-domains.tmp filters/getadmiral-domains.txt
            done < dead-domains.txt
          fi

      - name: Add dead-domains.txt to .gitignore
        run: |
          if ! grep -q "dead-domains.txt" .gitignore; then
            echo "dead-domains.txt" >> .gitignore
          fi

      - name: Sort & Generate Checksum
        run: |
          # FOP handles sorting and checksum
          ./scripts/checksum-sort.sh filters/getadmiral-domains.txt

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(filters): update admiral domains filter list"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: admiral-domains-update
          base: main
          delete-branch: true
          title: "chore(filters): update admiral domains filter list"
          body: |
            Update Admiral Domains Filter List:
            - Updated with *today's* date
            - Removed dead domains
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: automated pr
          assignees: LanikSJ
          reviewers: LanikSJ
          draft: false