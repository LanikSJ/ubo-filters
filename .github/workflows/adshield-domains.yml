name: AdShield Domains

on:
  schedule:
    - cron: "30 0 * * 3" # Runs 00:30 UTC Only on Wednesday
  push:
    branches:
      - main
    paths:
      - ".github/workflows/adshield-domains.yml"
  pull_request:
    paths:
      - ".github/workflows/adshield-domains.yml"
  workflow_dispatch:

env:
  NODE_VERSION: 20

permissions:
  contents: write
  pull-requests: write

jobs:
  Updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install FOP CLI
        run: ./scripts/install-fop.sh

      - name: Download AdShield List
        run: |
          # Preserve header (first 15 lines) and append new domains
          ./scripts/remove-lines.sh filters/adshield-domains.txt 15 > filters/adshield-domains.tmp

          # Try GitHub primary source, fall back to GitLab mirror on failure
          if curl -fsSL --fail https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/share/ad-shield.txt -o adshield-source.txt; then
            echo "Downloaded AdShield list from GitHub"
          else
            echo "GitHub source failed, falling back to GitLab mirror..."
            curl -fsSL --fail https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/share/ad-shield.txt -o adshield-source.txt
          fi

          sed 's/^/||/; s/$/^$third-party/' adshield-source.txt >> filters/adshield-domains.tmp
          rm -f adshield-source.txt
          mv -f filters/adshield-domains.tmp filters/adshield-domains.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Export Dead Domains
        run: npx dead-domains-linter --export dead-domains.txt -i filters/adshield-domains.txt

      - name: Remove Dead Domains from AdShield List
        run: |
          if [ -f dead-domains.txt ] && [ -s dead-domains.txt ]; then
            while IFS= read -r domain; do
              [ -z "$domain" ] && continue
              grep -vF "||${domain}^\$third-party" filters/adshield-domains.txt > filters/adshield-domains.tmp
              mv filters/adshield-domains.tmp filters/adshield-domains.txt
            done < dead-domains.txt
          fi

      - name: Add dead-domains.txt to .gitignore
        run: |
          if ! grep -q "dead-domains.txt" .gitignore; then
            echo "dead-domains.txt" >> .gitignore
          fi

      - name: Sort & Generate Checksum
        run: |
          # FOP handles sorting and checksum
          ./scripts/checksum-sort.sh filters/adshield-domains.txt

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(filters): update adshield domains filter list"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: adshield-domains-update
          base: main
          delete-branch: true
          title: "chore(filters): update adshield domains filter list"
          body: |
            Update Ad Shield Domains Filter List:
            - Updated with *today's* date
            - Removed dead domains
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: automated pr
          assignees: LanikSJ
          reviewers: LanikSJ
          draft: false
