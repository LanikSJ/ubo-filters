name: Fanboy Social

on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fanboy-social.yml"
  pull_request:
    paths:
      - ".github/workflows/fanboy-social.yml"
  workflow_dispatch:

env:
  NODE_VERSION: 20

permissions:
  contents: write
  pull-requests: write

jobs:
  Updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install FOP CLI
        run: ./scripts/install-fop.sh

      - name: Download Fanboy Social
        run: |
          curl -L https://easylist.to/easylist/fanboy-social.txt | grep -Ev '##|#@' > filters/fanboy-social-no-cosmetic.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Export Dead Domains
        run: npx dead-domains-linter --export dead-domains.txt -i filters/fanboy-social-no-cosmetic.txt

      - name: Remove Dead Domains from Fanboy Social
        run: |
          if [ -f dead-domains.txt ] && [ -s dead-domains.txt ]; then
            npx dead-domains-linter --auto --import dead-domains.txt
          fi

      - name: Add dead-domains.txt to .gitignore
        run: |
          if ! grep -q "dead-domains.txt" .gitignore; then
            echo "dead-domains.txt" >> .gitignore
          fi

      - name: Sort & Generate Checksum
        run: |
          # FOP handles sorting and checksum
          ./scripts/checksum-sort.sh filters/fanboy-social-no-cosmetic.txt

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(filters): update fanboy social without cosmetic filters"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: fanboy-social-update
          base: main
          delete-branch: true
          title: "chore(filters): update fanboy social without cosmetic filters"
          body: |
            Update Fanboy Social Without Cosmetic Filters:
            - Updated with *today's* date
            - Removed dead domains
            - Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: automated pr
          assignees: LanikSJ
          reviewers: LanikSJ
          draft: false
